{% extends "base.html" %}
{% load static %}

{% block title %}Add Service | BookMyService{% endblock %}

{% block content %}

<div class="dashboard-wrapper">

    {% include "includes/user_sidebar.html" %}

    <main class="dashboard-main">

        <div class="dashboard-header">

            <div>

                <p class="dashboard-label">
                    ADD SERVICE
                </p>

                <h2>
                    Add New Service
                </h2>

                <p class="dashboard-subtitle">
                    Add a new service to BookMyService.
                </p>

            </div>

        </div>

        <div id="message"></div>

        <div class="card p-4 mx-auto" style="max-width: 600px;">

            <form id="serviceForm">

                <div class="mb-3">

                    <label class="form-label">
                        Service Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter service name"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter service description"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                    onclick="serviceadd()"
                >
                    Add Service
                </button>

            </form>

        </div>

    </main>

</div>

<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/user/add_service.js' %}"></script>

{% endblock %}
