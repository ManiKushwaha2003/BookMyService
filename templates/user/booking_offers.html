{% extends "base.html" %}
{% load static %}

{% block title %}Booking Offers | BookMyService{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="mb-4">
        <h3 class="fw-semibold mb-1">
            <i class="bi bi-tags me-2 text-primary"></i>
            Booking Offers
        </h3>

        <p class="text-muted mb-0">
            View offers received from service providers
        </p>
    </div>

    <div id="offerMessage"></div>

    <div class="card border-0 shadow-sm">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>
                            <th>Booking ID</th>
                            <th>Serviec</th>
                            <th>Provider</th>
                            <th>Rating</th>
                            <th>Price</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th >Action</th>
                        </tr>

                    </thead>

                    <tbody id="offersTable">


                    </tbody>

                </table>
   
            </div>
       
        </div>
  
    </div>
                         <a
                                href="/user-dashboard/"
                                class="btn btn-outline-secondary"
                            >
                                <i class="bi bi-arrow-left me-1"></i>
                                Back
                            </a>
</div>


<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/user/booking_offers.js' %}"></script>

{% endblock %}
