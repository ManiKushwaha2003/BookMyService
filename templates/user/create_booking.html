
{% extends "base.html" %}
{% load static %}

{% block title %}Create Booking | BookMyService{% endblock %}

{% block content %}

<div class="dashboard-wrapper">

    {% include "includes/user_sidebar.html" %}

    <main class="dashboard-main">

        <div class="dashboard-header">

            <div>

                <p class="dashboard-label">
                    CREATE BOOKING
                </p>

                <h2>
                    Create New Booking
                </h2>

                <p class="dashboard-subtitle">
                    Select a service and describe your requirement.
                </p>

            </div>

        </div>


        <div id="message"></div>


        <div class="card p-4 mx-auto" style="max-width: 600px;">

            <form id="bookingForm">

                <!-- Client -->
                <div class="mb-3">

                    <label class="form-label">
                        Client
                    </label>

                    <input
                        type="text"
                        id="client"
                        class="form-control"
                        readonly
                    >

                </div>


                <!-- Service -->
                <div class="mb-3">

                    <label class="form-label">
                        Select Service
                    </label>

                    <select
                        id="service"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Service
                        </option>

                    </select>

                </div>


                <!-- Description -->
                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="4"
                        placeholder="Describe your service requirement"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Booking
                </button>

            </form>

        </div>

    </main>

</div>

<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/user/create_booking.js' %}"></script>

{% endblock %}
