
{% extends "base.html" %}
{% load static %}

{% block title %}
BookMyService - Register
{% endblock %}

{% block content %}

<section class="auth-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="auth-card">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Create Account</h2>
                        <p class="text-muted">Join BookMyService today</p>
                    </div>

                    <form id="registerForm">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username" class="form-control"
                                   placeholder="Enter username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control"
                                   placeholder="Enter email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" id="phone" class="form-control"
                                   placeholder="Enter 10 digit phone" maxlength="10">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea id="address" class="form-control"
                                      rows="2" placeholder="Enter address"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Account Type</label>
                            <select id="role" class="form-select" required>
                                <option value="">Select account type</option>
                                <option value="user">User</option>
                                <option value="provider">Provider</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control"
                                   placeholder="Minimum 8 characters" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="confirm_password" class="form-control"
                                   placeholder="Confirm password" required>
                        </div>

                        <!-- Message -->
                        <div id="messageBox" class="mb-3"></div>

                        <button type="submit" class="btn btn-primary w-100">
                            Create Account
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <p>
                            Already have an account?
                            <a href="/accounts/user/login/">Login</a>
                        </p>
                    </div>

                </div>

            </div>
        </div>
    </div>
</section>

<script src="{% static 'js/register.js' %}"></script>

{% endblock %}
